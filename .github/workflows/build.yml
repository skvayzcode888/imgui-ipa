name: Build dylib
 
on:
  push:
  workflow_dispatch:
 
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
 
      - name: Install Theos and ldid
        run: |
          brew install ldid
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
 
      - name: Download Dear ImGui 1.91.5
        run: git clone --depth 1 --branch v1.91.5 https://github.com/ocornut/imgui.git imgui
 
      - name: Build
        run: make FINALPACKAGE=1
 
      - name: Show build output
        run: find .theos -name "*.dylib"
 
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: MyMenu-dylib
          path: |
            .theos/obj/MyMenu.dylib
            .theos/obj/debug/MyMenu.dylib
          if-no-files-found: error
 
